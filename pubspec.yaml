name: charity_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.1.0

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0
  cupertino_icons: ^1.0.8
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  firebase_messaging: ^16.1.2
  provider: ^6.1.5+1
  google_sign_in: ^6.2.1
  image_picker: ^1.0.7
  file_picker: ^8.0.0+1
  intl: ^0.20.2
  share_plus: ^10.1.3
  path_provider: ^2.1.5
  screenshot: ^3.0.0
  http: ^1.6.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.2.3
  video_player: ^2.9.2
  camera: ^0.11.0+2
  gal: ^2.3.0
  permission_handler: ^11.3.1
  mime: ^1.0.5
  geolocator: ^14.0.2
  google_maps_flutter: ^2.17.1
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

# 👇 This generates the App Icons & Favicon perfectly with a white background 👇
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_logo.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/app_logo.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/app_logo.png
    - assets/
    - assets/google logo.png
    - assets/hero_banner.jpg
    - assets/dove_icons.png
    - assets/logo.png

